name: CI/CD Pipeline & Security Validation

on:
  push:
    branches:
      - main
      - master
      - Sahil-mondal
  pull_request:
    branches:
      - main
      - master
      - Sahil-mondal
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Backend Verification & Python Security
  # --------------------------------------------------------------------------
  backend:
    name: Backend Tests & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit

      - name: Python Bytecode & Syntax Validation
        run: |
          python -m compileall -q -x "\.venv" .
          echo "PASS: All Python modules compiled cleanly."

      - name: Dependency Security Audit (pip-audit)
        run: |
          pip-audit --desc on || echo "NOTICE: pip-audit completed with advisory warnings."

      - name: Run Backend Pytest Suite
        env:
          GEMINI_API_KEY: "ci-mock-key-testing-only"
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          CI: "true"
        run: |
          python -m pytest tests -q

  # --------------------------------------------------------------------------
  # 2. Frontend Build, Unit Tests & Node Security
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (Clean Install)
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Frontend Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-dist
          path: frontend/dist/
          retention-days: 14

  # --------------------------------------------------------------------------
  # 3. Infrastructure, Config & Secret Hygiene
  # --------------------------------------------------------------------------
  infrastructure-and-security:
    name: Infrastructure & Secret Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "PASS: docker-compose.yml is structurally valid and syntactically correct."

      - name: Verify .env is Excluded from Version Control
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "FAIL: .env is tracked in version control! Remove it immediately."
            exit 1
          fi
          echo "PASS: .env is properly untracked in Git."

      - name: Check for Accidentally Committed Google API Keys
        run: |
          echo "Scanning tracked files for Google API key signatures..."
          if grep -rn "AIzaSy" --exclude=".env*" --exclude="*.md" .; then
            echo "FAIL: Detected potential Google API key in tracked source files!"
            exit 1
          fi
          echo "PASS: No Google API keys found in tracked source files."

      - name: Verify Startup Scripts & Core Entry Points
        run: |
          for file in \
            "backend/app/main.py" \
            "frontend/package.json" \
            "frontend/src/main.tsx" \
            "streaming/spark_streaming.py" \
            "producer/producer.py" \
            "rag/investigation/kafka_investigation_consumer.py" \
            "database/schema.cql" \
            "models/isolation_forest_final.pkl" \
            "models/xgboost_second_stage.json"; do
            if [ ! -f "$file" ]; then
              echo "FAIL: Required entry file $file does not exist!"
              exit 1
            fi
          done
          echo "PASS: All application entry points and models exist."

  # --------------------------------------------------------------------------
  # 4. CD / Release Packaging (Runs only after CI passes)
  # --------------------------------------------------------------------------
  release:
    name: Package Release Artifact
    needs: [backend, frontend, infrastructure-and-security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Sahil-mondal' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-dist
          path: frontend/dist/

      - name: Create Deployable Release Archive
        run: |
          mkdir -p release-pkg
          tar -czf release-pkg/fraud-detection-platform-${{ github.sha }}.tar.gz \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.env' \
            .
          echo "PASS: Release package created: fraud-detection-platform-${{ github.sha }}.tar.gz"

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-pkg/
          retention-days: 30

      - name: Deployment Gate & Status Check
        run: |
          echo "=== CD / Deployment Status ==="
          if [ -n "${{ secrets.DEPLOY_TARGET_SSH_HOST }}" ]; then
            echo "Deploy target configured. Initiating automated staging deployment..."
            # Trigger custom deployment script here if configured
          else
            echo "NOTICE: No remote CD deployment target configured (e.g. DEPLOY_TARGET_SSH_HOST)."
            echo "CI validation and release artifact packaging completed successfully."
            echo "To enable CD: Configure deployment host/credentials in GitHub Repository Secrets."
          fi

